[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cvcourse"
version = "1.0"
description = "Общая библиотека курса «Введение в компьютерное зрение», Innopolis University, Fall 2026"
requires-python = ">=3.10"
# Версии закреплены здесь — это единственное место (WP0 §8.1).
# opencv-contrib-python — точная версия: эталонные числа в ноутбуках и ассертах
# привязаны к этой сборке, а в OpenCV 5.0 у HoughLinesP изменилась форма результата.
dependencies = [
  "opencv-contrib-python==4.14.0.94",
  "numpy>=1.26,<3",
  "matplotlib>=3.8",
  "scipy>=1.11",
  "scikit-image>=0.22",
  "scikit-learn>=1.4",
  "tqdm>=4.66",
]

[tool.setuptools]
packages = ["cvcourse"]
