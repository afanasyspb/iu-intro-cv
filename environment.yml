name: iu-intro-cv
channels: [conda-forge]
dependencies:
  - python=3.11
  - numpy>=1.26
  - matplotlib>=3.8
  - scipy>=1.11
  - scikit-image>=0.22
  - scikit-learn>=1.4
  - jupyterlab>=4.0
  - ipywidgets>=8.1
  - tqdm
  - pytest
  - pip
  - pip:
      # библиотека курса cvcourse + opencv-contrib-python==4.14.0.94 (pyproject.toml).
      # OpenCV только через pip: в conda-forge нет контриб-сборки нужной версии.
      - -e .
